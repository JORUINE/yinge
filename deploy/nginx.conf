# 音格 · Nginx 配置（阿里云 / 腾讯云 单机部署）
# ------------------------------------------------------------------
# 一台机器同时干三件事：发前端静态文件 + 把 /api 反代给 Node 后端 + 顶住 SPA 路由刷新。
#
# 放哪里（二选一）：
#   A. 裸服务器：把本文件复制成 /etc/nginx/conf.d/yinge.conf，
#      改完先 `nginx -t` 验语法，通过再 `nginx -s reload`
#   B. 宝塔面板：网站 → 你的站 → 配置文件 → 全文替换成本文件内容 → 保存
#
# ⚠️ 上线前必须改的两处（都标了 ←改）：
#   1. server_name：备案下来后填你的域名；没备案前用 IP 访问就保持 `_`
#   2. root：改成你服务器上仓库的实际路径
#
# ⚠️ 如果还没备案：中国大陆服务器 + 域名 + 80 端口 必须完成 ICP 备案才放行。
#    备案期间可以先用 `http://服务器IP:8080` 这类非标准端口临时测试
#    （把 listen 80 改成 listen 8080，并在阿里云安全组里放行 8080）。

server {
    listen 80;
    server_name _;                          # ←改：备案后填域名，如 yinge.example.com

    root /opt/yinge/frontend/dist;          # ←改：你服务器上的实际路径
    index index.html;

    # ── 压缩：文本类压完能小七成，手机流量下体感明显 ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 带 hash 的构建产物（/assets/xxx-HASH.js）放心缓存一年 ──
    #    文件名带内容 hash，内容一变文件名就变，不存在"改了还拿旧缓存"的问题
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 兜底 ──
    # 没有这一条，用户在 /battle/xxx/bracket 这种地址按 F5 刷新会直接 404，
    # 因为服务器上并不存在那个路径的文件。try_files 把它回退到 index.html，
    # 由前端路由自己渲染。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API 反代 ──
    # 前端页面里所有请求都打在 /api 下（见 frontend/src/api/client.js），
    # 由这里转给本机的 Node 服务（PM2 起的 yinge-api，端口 3000）。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 人格解读会调通义千问，偶尔要好几秒 —— 别让 Nginx 提前掐断
        # （默认 60s，若解读偶发超时再往上调）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 健康检查 ──
    # 云厂商的"健康检查"和我们的部署验收都打这两个地址。
    # `location =` 是精确匹配，优先级高于上面的 `location /`。
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:3000/ready;
    }
}
